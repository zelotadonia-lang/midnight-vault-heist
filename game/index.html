<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Vault — a museum heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0c11;
    color: #f2efe6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: #e8b64c;
  }
  p {
    margin: 0;
    font-size: 14px;
    color: #9aa0b4;
  }
  canvas {
    display: block;
    width: min(1280px, 96vw);
    height: auto;
    background: #1b1d26;
    border: 1px solid #3a3f52;
    border-radius: 6px;
  }
  .keys {
    font-size: 13px;
    color: #9aa0b4;
  }
  .keys b { color: #f2efe6; }
</style>
</head>
<body>
<h1>THE MIDNIGHT VAULT</h1>
<p>Steal the Star Sapphire. Pocket the artifacts. Leave by the green EXIT.</p>
<canvas id="game" width="1280" height="720"></canvas>
<p class="keys"><b>WASD / arrows</b> move &nbsp;·&nbsp; <b>click</b> walk to a spot &nbsp;·&nbsp; <b>Shift</b> sneak &nbsp;·&nbsp; <b>1</b> smoke &nbsp;·&nbsp; <b>2</b> EMP &nbsp;·&nbsp; <b>3</b> decoy &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
